<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b35"><title>関係法令 模擬テスト2</title><style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;color:#172522;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:16px}header{background:#173b35;color:white;padding:22px 20px;border-radius:20px;margin:8px 0 16px}h1{font-size:1.35rem;margin:0 0 8px}header p{margin:0;color:#d5e5df}.panel,.question{background:white;border:1px solid #e0e7e3;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #183d3210}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#64736d;font-size:.9rem}.bar{height:8px;background:#e5ece8;border-radius:9px;overflow:hidden;margin:14px 0}.bar div{height:100%;width:0;background:#2f806c}.qnum{color:#527168;font-weight:700}.qtext{font-size:1.1rem;line-height:1.9;margin:14px 0 20px;white-space:pre-wrap}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ans{border:2px solid #dce6e1;background:#fff;border-radius:14px;padding:16px 8px;font-size:1.25rem;font-weight:750;cursor:pointer}.ans:first-child{color:#16834f}.ans:last-child{color:#c33b42}.ans:disabled{opacity:.75}.feedback{padding:13px 14px;border-radius:12px;margin-top:14px;line-height:1.7;white-space:pre-wrap}.good{background:#e7f6ec;color:#155d34}.bad{background:#fff0ed;color:#8b2923}.unknown{background:#fff7dc;color:#73540c}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#173b35;color:white;font-weight:650}.secondary{background:#e8efeb;color:#24473d}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none}.score{font-size:2rem;font-weight:800;color:#173b35}.resultrow{padding:10px 0;border-bottom:1px solid #e7ece9;line-height:1.6}label{display:flex;gap:8px;align-items:center}.small{font-size:.82rem;line-height:1.6}@media(max-width:480px){.wrap{padding:12px}.panel,.question{padding:15px}.qtext{font-size:1.03rem}.ans{padding:14px 6px}}
</style></head><body><div class="wrap"><header><h1>関係法令 模擬テスト2</h1><p>〇✕クイズ・全40問｜スマホ・PC対応</p></header>
<section id="home" class="panel"><h2>テストを始める</h2><p>1問ずつ回答し、すぐに判定を確認できます。間違えた問題は最後に復習できます。</p><label><input type="checkbox" id="random"> 問題をランダムな順番で出題</label><p class="muted small">注意：写真から読み取った問題文を登録しています。正解データはまだ確認できていないため、推測で採点しません。正解が登録された問題のみ採点対象になります。</p><button id="start">スタート</button></section>
<section id="quiz" class="question hidden"><div class="row"><span class="qnum" id="counter"></span><span class="muted" id="progressText"></span></div><div class="bar"><div id="progress"></div></div><div class="qtext" id="qtext"></div><div class="answers"><button class="ans" data-value="〇">〇</button><button class="ans" data-value="✕">✕</button></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="controls"><button id="next" class="hidden">次の問題 →</button><button id="quit" class="secondary">途中で終了</button></div></section>
<section id="result" class="panel hidden"><h2>結果</h2><div class="score" id="score"></div><p id="summary"></p><div id="resultDetails"></div><div class="controls"><button id="review">間違えた問題を復習</button><button id="retry" class="secondary">全40問でもう一度</button></div></section>
<section id="reviewScreen" class="question hidden"><div class="row"><span class="qnum" id="reviewCounter">復習</span><span class="muted">間違えた問題</span></div><div class="qtext" id="reviewText"></div><div id="reviewFeedback" class="feedback bad"></div><div class="controls"><button id="reviewNext">次の復習問題 →</button><button id="backResult" class="secondary">結果に戻る</button></div></section><footer class="muted small" style="padding:12px 4px">配布前に原本と照合し、正解データを確認してから本番の採点に使用してください。</footer></div>
<script>const questions=[{"id": 1, "text": "技能２段階項目10「方向変換及び縦列駐車」は、後退動作を伴い危険なので必ず同乗の方法で行う。", "answer": "✕", "explanation": "車外において指導するのが効果的であると認められる教習細目については、適宜、教習指導員又は教習生が車外に出て指導することができる。"}, {"id": 2, "text": "転所をする場合、修了検定不合格時に原教習所で補修教習を受けていれば、新教習所で補修教習を受けなくても修了検定を受験できる。", "answer": "✕", "explanation": "新教習所でも補修教習を受ける必要があります。"}, {"id": 3, "text": "普通免許を受けようとする者の視力（矯正視力を含む）が左0.2、右0.7の場合は、右眼の視野が左右120度以上であること。", "answer": "✕", "explanation": "右眼の視野が左右120度以上必要です。"}, {"id": 4, "text": "第一種普通免許の教習課程では、必要に応じて原簿に以下の記号を〇で囲み朱書きする。（模・無・AT・シ・複・場・セ）", "answer": "✕", "explanation": "朱書きする箇所の「AT」は「MT」になります。"}, {"id": 5, "text": "技能教習については、道路において行う場合を除き、自動車教習所のコースその他の設備において行うこととされているが、その他の設備とは、模擬運転装置又は暗室等がこれに当たる。", "answer": "〇"}, {"id": 6, "text": "専ら指定教習所のコース内における教習に使用する車両は、道路運送車両法による登録を受ける必要がない。", "answer": "〇"}, {"id": 7, "text": "以下の条件に該当する場合は教習の中止を検討する。通行止めの交通規制が実施されている場合／交通規制や交通混雑により安全・円滑な教習が行えないと認められる場合／教習車両に異常が認められた場合。", "answer": "✕", "explanation": "これは中止を検討する条件ではなく、教習を行わせない条件です。"}, {"id": 8, "text": "教習指導員の法的根拠は、法第99条の3である。", "answer": "〇"}, {"id": 9, "text": "準中型免許の適性試験合格基準（視力）は、両眼0.8以上かつ片眼0.5以上であり、片目の視力が0.5未満若しくは見えない場合は、もう片方の目で0.8以上かつ視野が150度以上必要である。", "answer": "✕", "explanation": "準中型免許の取得要件は、両眼0.8以上かつ片眼0.5以上でなければなりません。"}, {"id": 10, "text": "運転シミュレーターによる教習は、1人の教習指導員につき3人以下の教習生を対象に実施すること。", "answer": "〇"}, {"id": 11, "text": "運転シミュレーターによる技能教習を2時限連続で実施した。", "answer": "✕", "explanation": "教習生の疲労を考慮し、2時限連続して行いません。"}, {"id": 12, "text": "普通免許限定条件の「AT車の普通車に限る」は一般原動機付自転車を運転することができる。", "answer": "✕", "explanation": "「AT車の普通車に限る」の場合、一般原動機付自転車を運転することはできません。"}, {"id": 13, "text": "AT中型（8t限定）のAT限定解除は普通車で行うため、普通車の指導員資格があれば担当できる。", "answer": "〇"}, {"id": 14, "text": "運転免許試験場で仮免許を取得して教習所へ入所した場合、途中で仮免許の有効期限が切れても、教習期間内であればすぐに教習所で修了検定を受けて仮免許を再取得できる。", "answer": "✕", "explanation": "運転免許試験場で仮免許を取得している場合、すぐに修了検定を受けて再取得することはできません。"}, {"id": 15, "text": "卒業検定は最後の技能教習が修了してから起算して3月以内に行うことが定められている。", "answer": "✕", "explanation": "技能教習だけではなく、すべての教習が終了してからです。"}, {"id": 16, "text": "普通免許の適性試験合格基準（視力）は、両眼0.7以上又は片眼0.3以上であり、片目の視力が0.3未満若しくは見えない場合は、もう片方の目で0.7以上かつ視野が150度以上必要である。", "answer": "✕", "explanation": "両眼0.7以上かつ片眼0.3以上が必要です。"}, {"id": 17, "text": "中型免許の技能教習を行う際は、その上位免許の指導員資格である大型免許の指導員資格を所持していれば、教習を行うことができる。", "answer": "✕", "explanation": "中型免許の教習を行う場合は、中型免許の指導員資格を所持しなければなりません。"}, {"id": 18, "text": "応急救護処置Ⅱの学科教習は、1人の指導員につきおおむね10名以下の教習生により実施することと定められている。", "answer": "〇"}, {"id": 19, "text": "運転適性検査K2において、「I」の評価が1、2の者は、自分をよく見せようとするタイプの人である。", "answer": "✕", "explanation": "「I」は非協調性を表すため、この説明は誤りです。"}, {"id": 20, "text": "学科教習第２段階項目１「危険予測ディスカッション」は、セット教習のため指導員１人で教習生１人を担当して教習を行うことができない。", "answer": "✕", "explanation": "セット教習は、指導員1人で教習生1人を担当して教習を行うこともできます。"}, {"id": 21, "text": "補修教習とは、仮免許の取消し処分を受けた者が再び修了検定を受検する前に既定の時限数を受ける技能教習および学科教習のことである。", "answer": "✕", "explanation": "これは補修教習ではなく、補充教習の説明です。"}, {"id": 22, "text": "自動車教習所は、免許を受けようとする者に対し、自動車の運転に関する技能及び知識について教習を行う施設と規定されている。", "answer": "〇"}, {"id": 23, "text": "みきわめを行える指導員は技能検定員を兼ねている者、当該教習の技能教習の経験が３年以上ある者、経験が３年未満で管理者が認定した者である。", "answer": "✕", "explanation": "当該教習の技能教習の経験が2年以上ある者、または経験が2年未満で管理者が認定した者です。"}, {"id": 24, "text": "オンライン学科教習でライブ配信方式では同時且つ双方向に行われるので、すべての学科教習項目を行うことができる。", "answer": "✕", "explanation": "すべての項目ではなく、「危険予測ディスカッション」および「応急救護処置」を行うことができません。"}, {"id": 25, "text": "角膜矯正コンタクトをしている者が教習前の視力検査で基準に達しなかったが、メガネを持参していたため視力検査をせずに眼鏡をかけて教習を行った。", "answer": "✕", "explanation": "視力検査は必要です。"}, {"id": 26, "text": "学科教習については、自動車教習所の建物その他の設備において行うこととされているが、オンラインによる学科教習は自宅等で受講しても差し支えない。", "answer": "〇"}, {"id": 27, "text": "現に原付免許を所持している者に対する基本操作及び基本走行の最短教習時限は15時限である。", "answer": "✕", "explanation": "原付免許を所持していても、最短教習時限は変わらず16時限です。"}, {"id": 28, "text": "模擬運転装置による教習は、技能教習第一段階では項目1～項目5までの範囲に限られるため、技能教習第一段階ではそれ以外の項目では実施できない。", "answer": "〇"}, {"id": 29, "text": "教習指導員が応急措置を講ずることのできる装置（補助ブレーキ等）と後写鏡を備え付けた無線教習車であっても無線教習以外の教習に使用することはできない。", "answer": "✕", "explanation": "無線教習以外の教習にも使用することができます。"}, {"id": 30, "text": "指定教習所の指導員は教習で使用する印鑑を公安委員会に届け出なければならない。", "answer": "✕", "explanation": "指導員の印鑑を公安委員会に届け出る必要はありません。"}, {"id": 31, "text": "臨時指導員は１年以上継続して選任しなくてはならないが法定講習を受ける義務はない。", "answer": "✕", "explanation": "臨時指導員にも、法定教習を受ける義務があります。"}, {"id": 32, "text": "仮免学科試験は本来、公安委員会が行うが、事務の効率化を図るため現在は委託され指定教習所が個々に学科試験問題を作成し、試験を行っている。", "answer": "✕", "explanation": "仮免学科試験の問題は、公安委員会が作成して試験を行います。"}, {"id": 33, "text": "指定教習所がその指定を取り消された時、１年が経過すれば再度指定を受けることができる。", "answer": "✕", "explanation": "1年ではなく、3年が経過する必要があります。"}, {"id": 34, "text": "運転適性検査（K2）でfの評価が1、2のものは調子に乗りやすいタイプである。", "answer": "✕", "explanation": "Fの評価は、回帰性などにより気分が落ち込みやすいタイプを表します。"}, {"id": 35, "text": "模擬運転装置は技能教習の最初に必ず行わなければならない。", "answer": "✕", "explanation": "模擬運転装置による教習は、必ず行わなければならないものではありません。"}, {"id": 36, "text": "応用走行項目12「自主経路設定」は、学科教習第２段階項目１「危険予測ディスカッション」及び項目16「経路の設計」を修了した者に対し行わせること。", "answer": "✕", "explanation": "学科教習第2段階項目1「危険予測ディスカッション」は必要ありません。"}, {"id": 37, "text": "小型AT限定自動二輪免許は、所持免許によっては最短２日で取得できる。", "answer": "〇"}, {"id": 38, "text": "同一の教習内容であっても、第一種免許に係る学科教習と第二種免許に係る学科教習を合同で実施することはできない。", "answer": "〇"}, {"id": 39, "text": "技能審査合格証明書の有効期間は６ヶ月である。", "answer": "✕", "explanation": "技能審査合格証明書の有効期間は、6か月ではなく1年です。"}, {"id": 40, "text": "オンライン学科教習であっても、選任されている教習指導員に実施させること。", "answer": "〇"}];let order=[],pos=0,answers={},reviewIds=[],reviewPos=0;const $=id=>document.getElementById(id);function show(id){['home','quiz','result','reviewScreen'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function start(retry=false){order=questions.map(q=>q.id);if($('random').checked&&!retry)order.sort(()=>Math.random()-.5);pos=0;answers={};show('quiz');render()}function render(){let q=questions.find(x=>x.id===order[pos]);$('counter').textContent=`第${pos+1}問 / ${order.length}問`;$('progressText').textContent=`回答済み ${Object.keys(answers).length}`;$('progress').style.width=`${pos/order.length*100}%`;$('qtext').textContent=q.id+'. '+q.text;$('feedback').className='feedback hidden';$('next').classList.add('hidden');document.querySelectorAll('.ans').forEach(b=>{b.disabled=false;b.style.outline='';b.onclick=()=>choose(q,b.dataset.value)})}function choose(q,val){if(answers[q.id])return;answers[q.id]=val;document.querySelectorAll('.ans').forEach(b=>{b.disabled=true;if(b.dataset.value===val)b.style.outline='3px solid #9ab6aa'});let f=$('feedback');f.className='feedback';if(q.answer===null){f.classList.add('unknown');f.textContent=`あなたの回答：${val}。正解データ未確認のため、採点していません。`}else if(q.answer===val){f.classList.add('good');f.textContent=`正解！ あなたの回答：${val}`}else{f.classList.add('bad');f.textContent=`不正解。あなたの回答：${val}／正解：${q.answer}`} if(q.explanation){f.textContent += `\n\n【解説】\n${q.explanation}`;} $('progressText').textContent=`回答済み ${Object.keys(answers).length}`;$('next').textContent=pos===order.length-1?'結果を見る':'次の問題 →';$('next').classList.remove('hidden')}function finish(){show('result');let checked=questions.filter(q=>answers[q.id]&&q.answer!==null),correct=checked.filter(q=>answers[q.id]===q.answer).length,wrong=checked.filter(q=>answers[q.id]!==q.answer);let unknown=Object.keys(answers).filter(id=>questions.find(q=>q.id===+id)?.answer===null).length;$('score').textContent=checked.length?`${correct} / ${checked.length}`:'採点対象 0問';$('summary').textContent=`正答率：${checked.length?Math.round(correct/checked.length*100)+'%':'算出できません'}｜正解未確認：${unknown}問`;$('resultDetails').innerHTML=`<div class="resultrow">回答数：${Object.keys(answers).length} / ${questions.length}</div><div class="resultrow">正解：${correct}問</div><div class="resultrow">不正解：${wrong.length}問</div><div class="resultrow">正解データ未確認：${unknown}問</div>`;reviewIds=wrong.map(q=>q.id);$('review').disabled=!reviewIds.length}$('start').onclick=()=>start();$('next').onclick=()=>{if(pos<order.length-1){pos++;render()}else finish()};$('quit').onclick=finish;$('retry').onclick=()=>start(true);$('review').onclick=()=>{if(reviewIds.length){reviewPos=0;showReview()}};function showReview(){show('reviewScreen');let q=questions.find(x=>x.id===reviewIds[reviewPos]);$('reviewCounter').textContent=`復習 ${reviewPos+1} / ${reviewIds.length}問`;$('reviewText').textContent=q.id+'. '+q.text;$('reviewFeedback').textContent=`あなたの回答：${answers[q.id]}／正解：${q.answer}`;$('reviewNext').textContent=reviewPos===reviewIds.length-1?'復習を終了':'次の復習問題 →'}$('reviewNext').onclick=()=>{if(reviewPos<reviewIds.length-1){reviewPos++;showReview()}else show('result')};$('backResult').onclick=()=>show('result');</script></body></html>
